name: daily

on:
  repository_dispatch:
    types: [dayclp-daily]
  workflow_dispatch:
    inputs:
      stop_after:
        description: stop after this step (empty runs everything)
        required: false
        default: ''
      clips:
        description: number of clips to generate (empty means all)
        required: false
        default: ''
      avoid:
        description: topics to avoid, separated by |
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: dayclp
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          path: ui
      - name: Load site branch
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" site
          else
            mkdir site
          fi
          rm -rf site/.git
      - uses: actions/checkout@v4
        with:
          repository: ifpksec/dayclp_src
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q -r src/requirements.txt
      - name: Run
        working-directory: src
        env:
          WA_BASE: ${{ secrets.WA_BASE }}
          WA_KEY: ${{ secrets.WA_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_DIR: ${{ github.workspace }}/site
          WORK_DIR: ${{ runner.temp }}/work
          DAYCLP_STOP_AFTER: ${{ inputs.stop_after }}
          DAYCLP_AVOID: ${{ inputs.avoid }}
          DAYCLP_CLIPS: ${{ inputs.clips }}
        run: |
          git rev-parse HEAD
          python main.py
      - name: Save work
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dayclp-work-${{ github.run_id }}
          path: ${{ runner.temp }}/work
          retention-days: 30
          if-no-files-found: ignore
      - name: Publish
        run: |
          if [ -z "${{ inputs.stop_after }}" ]; then rm -rf site/live; fi
          cp ui/index.html ui/favicon.svg site/
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "dayclp"
          git config user.email "dayclp@users.noreply.github.com"
          git add -A
          git commit -q -m "publish $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
